<!DOCTYPE html>
<html>
<head>
  <title>MediaPipe HandLandmarker Diagnostics</title>
  <style>
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: monospace;
      padding: 24px;
    }
    button {
      background: #06b6d4;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 12px;
      font-family: monospace;
    }
    button:hover {
      background: #22d3ee;
    }
    pre {
      background: #020617;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 500px;
    }
  </style>
</head>
<body>
  <h1>MediaPipe HandLandmarker Diagnostics</h1>
  <p>Run these isolated tests to pinpoint where the WebAssembly/model loader is stalling.</p>
  
  <button id="btn-cdn-image">Run CDN Test (IMAGE)</button>
  <button id="btn-cdn-video">Run CDN Test (VIDEO)</button>
  <button id="btn-local-image">Run Local Test (IMAGE)</button>
  <button id="btn-local-video">Run Local Test (VIDEO)</button>
  
  <h3>Logs:</h3>
  <pre id="log">Click one of the buttons above to run the diagnostics test...</pre>
  
  <script type="module">
    import { FilesetResolver, HandLandmarker } from "/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs";
    
    const logEl = document.getElementById('log');
    function log(msg) {
      console.log(msg);
      logEl.innerText += '\n' + msg;
    }
    
    async function runTest(useCdn, isVideo) {
      logEl.innerText = "Starting " + (useCdn ? "CDN" : "Local") + " test in " + (isVideo ? "VIDEO" : "IMAGE") + " mode...";
      try {
        const basePath = useCdn 
          ? "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
          : "/wasm";
        const modelPath = useCdn
          ? "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          : "/hand_landmarker.task";
          
        log("1. Resolving fileset from: " + basePath);
        const vision = await FilesetResolver.forVisionTasks(basePath);
        log("   Fileset resolved: " + JSON.stringify(vision));
        
        log("2. Fetching model file from: " + modelPath);
        const response = await fetch(modelPath);
        if (!response.ok) throw new Error("Fetch failed: " + response.statusText);
        const modelBuffer = new Uint8Array(await response.arrayBuffer());
        log("   Model fetched successfully: " + modelBuffer.length + " bytes");
        
        log("3. Creating HandLandmarker instance (compiling WebAssembly)...");
        const landmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetBuffer: modelBuffer,
            delegate: "CPU"
          },
          runningMode: isVideo ? "VIDEO" : "IMAGE"
        });
        log("🎉 SUCCESS: HandLandmarker instance created successfully!");
        
        if (!isVideo) {
          log("4. Running hand detection on /TestImages/fret1.png...");
          const img = new Image();
          img.src = "/TestImages/fret1.png";
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject(new Error("Failed to load /TestImages/fret1.png"));
          });
          
          const results = landmarker.detect(img);
          log("   Detection results: " + JSON.stringify(results));
          if (results.handLandmarks && results.handLandmarks.length > 0) {
            log("   ✅ SUCCESS: Detected " + results.handLandmarks.length + " hand(s)!");
          } else {
            log("   ❌ FAILURE: No hands detected in the test image.");
          }
        }
        
        landmarker.close();
      } catch (err) {
        log("❌ ERROR: " + err.message + '\n' + err.stack);
      }
    }
    
    document.getElementById('btn-cdn-image').onclick = () => runTest(true, false);
    document.getElementById('btn-cdn-video').onclick = () => runTest(true, true);
    document.getElementById('btn-local-image').onclick = () => runTest(false, false);
    document.getElementById('btn-local-video').onclick = () => runTest(false, true);
  </script>
</body>
</html>
