<rect x="214" y="112" width="33.25" height="14" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-dasharray="2,1" stroke-width="0.5"/>
<text x="230.625" y="109" font-size="2.4" font-weight="bold" fill="#0284c7" text-anchor="middle">STRUM ZONE</text>
<rect x="10" y="140" width="260" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
<text x="18" y="148" font-size="3.6" font-weight="bold" fill="#0f172a">✂️ Assembly Instructions in 4 Steps:</text>
<text x="18" y="155.5" font-size="2.8" fill="#1e293b"><tspan font-weight="bold" fill="#0284c7">1. Print Sheets 1 to 3:</tspan> Verify the 50mm scale box with a ruler. If it is 50mm, your scale is exact.</text>
<text x="18" y="162.5" font-size="2.8" fill="#1e293b"><tspan font-weight="bold" fill="#0284c7">2. Trim the Cut Lines:</tspan> On <tspan font-weight="bold">Page 2</tspan>, cut cleanly along the red dashed line at 170 mm. On <tspan font-weight="bold">Page 3</tspan>, cut at 375 mm.</text>
<text x="18" y="169.5" font-size="2.8" fill="#1e293b"><tspan font-weight="bold" fill="#0284c7">3. Align &amp; Join:</tspan> Lay Page 2 over the shaded tab of Page 1. Align the red crosshair targets ⨁ and fret lines, then tape or glue.</text>
<text x="18" y="174" font-size="2.5" fill="#64748b">Repeat with Page 3 over Page 2. You now have a complete, continuous 64 cm guitar neck!</text>
<text x="18" y="180.5" font-size="2.8" fill="#1e293b"><tspan font-weight="bold" fill="#0284c7">4. Mount &amp; Play:</tspan> Affix to your wooden strip or card. Hold like a real guitar in front of your camera, launch ARGuitar, and strum!</text>
</svg>
