<text x="203" y="82" font-size="2.4" font-family="monospace" fill="#0284c7" text-anchor="middle">5</text>
<text x="210" y="73" font-size="2.5" font-weight="bold" fill="#0369a1">← 50 mm (5.0 cm)</text>
<text x="153" y="88" font-size="2.4" fill="#64748b">Verify each printed sheet against this 50mm test bar.</text>
<rect x="10" y="96" width="260" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
<text x="18" y="104" font-size="3.5" font-weight="bold" fill="#0f172a">📐 Complete AR Guitar Layout (Fender 25.5" / 64.8 cm Scale, 46 mm Neck Width):</text>
