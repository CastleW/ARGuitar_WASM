<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 195" width="280mm" height="195mm" style="background:#ffffff; font-family:system-ui,-apple-system,sans-serif;">
<rect x="10" y="8" width="260" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
<text x="18" y="19" font-size="7" font-weight="900" fill="#0f172a">🎸 ARGuitar — Construction &amp; Assembly Guide</text>
<text x="18" y="27" font-size="3.6" font-weight="600" fill="#0284c7">Overview, Measurements &amp; Step-by-Step Instructions for Making Your AR Guitar</text>
<rect x="10" y="40" width="125" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="18" y="49" font-size="4" font-weight="bold" fill="#0f172a">📦 Materials &amp; Tools Needed:</text>
<text x="18" y="57" font-size="2.8" fill="#334155">• <tspan font-weight="bold">Base Strip:</tspan> Wood batten, molding, heavy cardboard, or ruler</text>
<text x="22" y="62" font-size="2.5" fill="#64748b">Recommended size: ~45–46 mm wide × ~60–65 cm long, ~1 cm thick</text>
<text x="18" y="68" font-size="2.8" fill="#334155">• <tspan font-weight="bold">Standard Printer Paper:</tspan> 3 sheets of A4 or US Letter</text>
<text x="18" y="74" font-size="2.8" fill="#334155">• <tspan font-weight="bold">Craft Tools:</tspan> Scissors or hobby knife &amp; metal ruler</text>
<text x="18" y="80" font-size="2.8" fill="#334155">• <tspan font-weight="bold">Adhesive:</tspan> Glue stick, double-sided tape, or clear packing tape</text>
<text x="18" y="86" font-size="2.8" fill="#334155">• <tspan font-weight="bold">Webcam:</tspan> 720p or 1080p camera connected to a computer</text>
<rect x="145" y="40" width="125" height="52" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
<text x="153" y="49" font-size="4" font-weight="bold" fill="#0369a1">⚠️ CRITICAL: 100% Print Scale</text>
<text x="153" y="57" font-size="2.8" fill="#0369a1">In your print dialog, select <tspan font-weight="bold">"Actual Size"</tspan> or <tspan font-weight="bold">"100%"</tspan>.</text>
<text x="153" y="62" font-size="2.5" fill="#0284c7">Do NOT choose "Fit to Page" or "Shrink to Fit".</text>
<rect x="153" y="67" width="50" height="9" fill="#ffffff" stroke="#0284c7" stroke-width="0.6"/>
<line x1="153" y1="67" x2="153" y2="76" stroke="#0284c7" stroke-width="0.6"/>
<text x="153" y="82" font-size="2.4" font-family="monospace" fill="#0284c7" text-anchor="middle">0</text>
