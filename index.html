<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Guitar - Play Augmented Reality Guitar</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Global Error Overlay for Debugging -->
    <script type="text/javascript">
      window.addEventListener('error', function(e) {
        var consoleDiv = document.getElementById('debug-error-console');
        if (consoleDiv) {
          consoleDiv.style.display = 'block';
          consoleDiv.appendChild(document.createTextNode('\nError: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')'));
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var consoleDiv = document.getElementById('debug-error-console');
        if (consoleDiv) {
          consoleDiv.style.display = 'block';
          var reason = e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'Unknown Promise Rejection';
          consoleDiv.appendChild(document.createTextNode('\nPromise Rejection: ' + reason));
        }
      });
    </script>
    
    <!-- OpenCV.js configuration -->
    <script type="text/javascript">
      var Module = {
        onRuntimeInitialized: function() {
          if (typeof cv !== 'undefined') {
            window.cv = cv;
            console.log("OpenCV.js initialized successfully!");
            window.dispatchEvent(new Event('opencv-ready'));
          } else {
            console.log("onRuntimeInitialized triggered by a non-OpenCV module.");
          }
        }
      };
    </script>
    <script src="https://docs.opencv.org/4.8.0/opencv.js" async defer></script>


  </head>
  <body>
    <div id="debug-error-console" style="position: fixed; top: 0; left: 0; right: 0; background: #ef4444; color: white; z-index: 999999; padding: 12px; font-family: monospace; font-size: 13px; line-height: 1.4; border-bottom: 2px solid #b91c1c; display: none; white-space: pre-wrap; max-height: 200px; overflow-y: auto;">
      <strong>⚠️ Client-side Error Detected:</strong>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
